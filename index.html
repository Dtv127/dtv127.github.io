<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Nộp Cá Nhân - Đỗ Tường Vy</title>
    <!-- Nhúng font chữ hiện đại từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Liên kết file CSS -->
    <link rel="stylesheet" href="intro.css">
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Be Vietnam Pro', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Nền gradient xanh biển nhẹ nhàng, hợp với chủ đề hồ cá & công nghệ */
    background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #e0e7ff 100%);
    padding: 20px;
}

.card {
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(10px);
    width: 100%;
    max-width: 420px;
    padding: 40px 32px;
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(14, 116, 144, 0.12);
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.8);
    transition: transform 0.3s ease;
}

.card:hover {
    transform: translateY(-5px);
}

.badge {
    display: inline-block;
    background-color: #e0f2fe;
    color: #0284c7;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 50px;
    margin-bottom: 16px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}

h1 {
    font-size: 28px;
    font-weight: 700;
    color: #0f172a;
    margin-bottom: 16px;
}

.info {
    background-color: #f8fafc;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 24px;
    border: 1px solid #f1f5f9;
}

.info p {
    font-size: 15px;
    color: #475569;
    margin: 6px 0;
}

.info span {
    font-weight: 600;
    color: #1e293b;
}

.divider {
    height: 1px;
    background: #e2e8f0;
    margin-bottom: 24px;
}

.links {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.btn {
    display: block;
    text-decoration: none;
    padding: 14px 20px;
    border-radius: 14px;
    font-weight: 600;
    font-size: 16px;
    transition: all 0.25s ease;
}

/* Nút Hồ cá */
.btn-aquarium {
    background: linear-gradient(135deg, #0284c7, #0ea5e9);
    color: white;
    box-shadow: 0 8px 16px rgba(2, 132, 199, 0.25);
}

.btn-aquarium:hover {
    background: linear-gradient(135deg, #0369a1, #0284c7);
    transform: translateY(-2px);
    box-shadow: 0 12px 20px rgba(2, 132, 199, 0.35);
}

/* Nút CV */
.btn-cv {
    background-color: #ffffff;
    color: #0f172a;
    border: 2px solid #e2e8f0;
}

.btn-cv:hover {
    border-color: #0284c7;
    color: #0284c7;
    background-color: #f0f9ff;
    transform: translateY(-2px);
}
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">Bài nộp cá nhân</div>
        <h1>Đỗ Tường Vy</h1>
        
        <div class="info">
            <p><span>Class name:</span>2611COMP180201</p>
            <p><span>Lớp:</span> CNTT.A</p>
            <p><span>MSSV:</span> 52.01.104.113</p>
        </div>

        <div class="divider"></div>

        <ul class="links">
            <li>
                <a href="aquarium/index.html" class="btn btn-aquarium">
                    🐠 Hồ cá 
                </a>
            </li>
            <li>
                <a href="cv/index.html" class="btn btn-cv">
                    📄 CV cá nhân
                </a>
            </li>
        </ul>
    </div>
</body>
</html>
