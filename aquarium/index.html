<body>
    <div class="top-controls">
    <a href="../index.html" class="btn-back">← Home</a>
    <button id="btn-bg" onclick="doiCanhNen()">Đổi cảnh nền</button>
    <button id="btn-music" onclick="batTatNhac()">Phát nhạc</button>
</div>

<audio id="bg-music" src="audioo/bbs.mp3" loop></audio>

<div id="hoca">
    <div id="shark"><img src="img/shark.png"; width="auto" height="auto"></div>
    <div id="ng2">

    <script>
    const hoca = document.getElementById("hoca");
    const music = document.getElementById("bg-music");
    const btnMusic = document.getElementById("btn-music");

    const danhSachAnhNen = [
        "img/bachrao.jpg",
        "img/bachrao2.jpg",
        "img/bachrao3.jpg",
        "img/bachrao4.jpg"
    ];

    let chiSoAnh = 0;

    function doiCanhNen() {
        chiSoAnh = (chiSoAnh + 1) % danhSachAnhNen.length;
        hoca.style.backgroundImage = `url('${danhSachAnhNen[chiSoAnh]}')`;
        hoca.style.backgroundSize = "cover";
        hoca.style.backgroundPosition = "center";
    }

    function batTatNhac() {
        if (music.paused) {
            music.play();
            btnMusic.textContent = "Ngừng phát nhạc";
        } else {
            music.pause();
            btnMusic.textContent = "Phát nhạc";
        }
    }
</script>
